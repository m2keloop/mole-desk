name: Build and publish beta

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Only versioned beta tags such as v0.1.0-beta.1 can be published."
            exit 1
          fi

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test macOS functionality
        run: ./test.sh
      - name: Build and verify app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          ./build.sh
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION%%-beta.*}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "盘览.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "盘览.app/Contents/Info.plist"
          codesign --force --sign - "盘览.app"
          codesign --verify --deep --strict --verbose=2 "盘览.app"
          lipo "盘览.app/Contents/MacOS/MoleDesk" -verify_arch "$EXPECTED_ARCH"
      - name: Package macOS app
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p release/package
          ditto "盘览.app" "release/package/盘览.app"
          cp LICENSE README.md release/package/
          ditto -c -k --sequesterRsrc --keepParent release/package "release/MoleDesk-macOS-${PACKAGE_ARCH}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/MoleDesk-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: windows/go.mod
          cache: false
      - name: Test and build Windows clients
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }
          ./build.ps1
      - name: Smoke test Windows x64 startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/MoleDesk-windows-amd64.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) { throw "Windows client exited during startup: $($process.ExitCode)" }
          } finally {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
          }
      - name: Package Windows apps
        shell: pwsh
        run: |
          foreach ($item in @(@{arch='amd64'; label='x64'}, @{arch='arm64'; label='arm64'})) {
            $folder = "package/$($item.label)"
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item "dist/MoleDesk-windows-$($item.arch).exe" "$folder/MoleDesk.exe"
            Copy-Item README.md,../LICENSE $folder
            Compress-Archive -Path "$folder/*" -DestinationPath "dist/MoleDesk-Windows-$($item.label).zip"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-packages
          path: windows/dist/*.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [validate, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - name: Verify packages and create checksums
        working-directory: release
        run: |
          set -euo pipefail
          for asset in MoleDesk-macOS-arm64.zip MoleDesk-macOS-x86_64.zip MoleDesk-Windows-x64.zip MoleDesk-Windows-arm64.zip; do
            test -s "$asset"
          done
          sha256sum MoleDesk-macOS-arm64.zip MoleDesk-macOS-x86_64.zip MoleDesk-Windows-x64.zip MoleDesk-Windows-arm64.zip > SHA256SUMS.txt
      - name: Publish pre-release without manual approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false \
            --title "盘览 ${RELEASE_TAG} · 预发布" \
            --notes-file .github/release/beta-notes.md \
            release/MoleDesk-macOS-arm64.zip release/MoleDesk-macOS-x86_64.zip \
            release/MoleDesk-Windows-x64.zip release/MoleDesk-Windows-arm64.zip release/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
